<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Curavo logo (Option B, "Glass cross", chosen Nov 2026).
       Evolved from the original HCC mark: the same medical cross and ribbon,
       now on a rounded indigo-to-violet tile so it matches the app's accent. -->
  <defs>
    <linearGradient id="curavoTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect width="64" height="64" rx="18" fill="url(#curavoTile)"/>
  <!-- White medical cross -->
  <rect x="26" y="12" width="12" height="40" rx="4.5" fill="#ffffff"/>
  <rect x="12" y="26" width="40" height="12" rx="4.5" fill="#ffffff"/>
  <!-- Mint ribbon sweeping through the cross -->
  <path d="M13 43 Q25 31 32 34 Q39 37 51 24" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
