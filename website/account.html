<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Curavo account</title>
<meta name="description" content="Sign in to Curavo: your shop details, subscription and the Windows download.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!--
  Curavo account pages (decided 4 Nov 2026): one file for every screen, so
  the website stays plain files.  The web server sends these addresses here:
    /account                 sign in, or "My account" once signed in
    /account/verify?token=   the link in the "confirm your email" message
    /account/reset?token=    the link in the "reset your password" message
    /link?code=ABCD-2345     a shop PC asking to use this account (Allow / Don't allow)
  Everything it shows comes from the Curavo cloud (SITE.api below); it keeps
  only the sign-in token, in this browser.
-->
<style>
:root {
  --paper:  #f5f6fd;
  --ink:    #1e1b4b;
  --ink-2:  #4b5170;
  --hint:   #8a8fa8;
  --accent: #4f46e5;
  --accent-soft: rgba(99,102,241,0.12);
  --mint:   #0f9f78;
  --mint-soft: rgba(110,231,183,0.22);
  --line:   rgba(30,27,75,0.10);
  --glass:  rgba(255,255,255,0.72);
  --warn:   #b45309;  --warn-soft: #fef3c7;
  --danger: #be123c;  --danger-soft: #ffe4e6;
  --font: 'Outfit', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0; font-family: var(--font); color: var(--ink); font-size: 16px; line-height: 1.55;
  background:
    radial-gradient(900px 520px at 85% -10%, rgba(165,180,252,0.45), transparent 70%),
    radial-gradient(700px 480px at -10% 30%, rgba(110,231,183,0.22), transparent 70%),
    var(--paper);
  min-height: 100vh; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
a { color: var(--accent); }
:focus-visible { outline: 3px solid rgba(79,70,229,0.45); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
header { padding-block: 18px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 20px; }
.brand svg { width: 32px; height: 32px; }
main { padding-block: 12px 64px; }
.narrow { max-width: 440px; margin: 0 auto; }
.card { background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.9); border-radius: 22px; box-shadow: 0 18px 50px rgba(30,27,75,0.08); padding: 28px; }
h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 6px; font-weight: 600; text-wrap: balance; }
h2 { font-size: 19px; margin: 0 0 12px; font-weight: 600; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); margin: 0 0 22px; }
label { display: block; font-size: 14px; font-weight: 500; color: var(--ink-2); margin: 14px 0 6px; }
input { width: 100%; font: 400 16px/1.3 var(--font); color: var(--ink); background: #fff; border: 1px solid rgba(30,27,75,0.16); border-radius: 12px; padding: 12px 14px; }
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.18); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 15px/1 var(--font); padding: 13px 20px; border-radius: 12px; border: 1px solid transparent; cursor: pointer; text-decoration: none; }
.btn { white-space: nowrap; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(79,70,229,0.25); }
.btn-ghost { background: #fff; color: var(--ink); border-color: rgba(30,27,75,0.14); }
.btn-danger { background: #fff; color: var(--danger); border-color: rgba(190,18,60,0.3); }
.full { width: 100%; margin-top: 20px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.or { display: flex; align-items: center; gap: 12px; color: var(--hint); font-size: 13px; margin: 20px 0 14px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.links { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 16px; font-size: 14px; }
.note { border-radius: 12px; padding: 12px 14px; font-size: 14.5px; margin: 0 0 16px; }
.note.ok { background: var(--mint-soft); color: #065f46; }
.note.err { background: var(--danger-soft); color: var(--danger); }
.note.warn { background: var(--warn-soft); color: #92400e; }
.note.info { background: var(--accent-soft); color: #3730a3; }
.muted { color: var(--hint); font-size: 13.5px; }
.code { font-family: var(--mono); font-size: 22px; letter-spacing: 0.08em; background: #fff; border: 1px dashed rgba(79,70,229,0.4); border-radius: 12px; padding: 10px 14px; display: inline-block; }
.grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }
.grid > * { min-width: 0; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .card { padding: 22px; } }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
@media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
.pc { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.pc:first-child { border-top: 0; }
.pill { display: inline-block; font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; }
.pill.ok { background: var(--mint-soft); color: #065f46; }
.pill.warn { background: var(--warn-soft); color: #92400e; }
.plans { display: grid; gap: 10px; margin-top: 12px; }
.plan { display: flex; justify-content: space-between; align-items: baseline; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.plan b { font-size: 18px; }
label.plan { cursor: pointer; margin: 0; font-weight: 400; transition: border-color .15s, box-shadow .15s; }
label.plan input { position: absolute; opacity: 0; pointer-events: none; }
label.plan:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
label.plan:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.plan-name { display: flex; gap: 10px; align-items: flex-start; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; margin-top: 2px; }
label.plan:has(input:checked) .radio { border: 5px solid var(--accent); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.top-right { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
#gbtn { min-height: 44px; display: flex; justify-content: center; }
.btn-sm { padding: 8px 14px; font-size: 14px; }
.pill.info { background: var(--accent-soft); color: #3730a3; }
.status-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lead { font-size: 18px; margin: 12px 0 4px; }
.timeline { list-style: none; margin: 18px 0 0; padding: 0; }
.timeline li { position: relative; padding: 0 0 18px 34px; display: flex; flex-direction: column; }
.timeline li span { color: var(--ink-2); font-size: 14px; }
.timeline li b { font-weight: 600; }
.timeline li::before { content: ""; position: absolute; left: 0; top: 2px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(30,27,75,0.18); background: #fff; box-sizing: border-box; }
.timeline li::after { content: ""; position: absolute; left: 9px; top: 24px; bottom: 2px; width: 2px; background: rgba(30,27,75,0.10); }
.timeline li:last-child { padding-bottom: 0; }
.timeline li:last-child::after { display: none; }
.timeline li.done::before { background: var(--mint); border-color: var(--mint); }
.timeline li.done::after { background: var(--mint); }
.timeline li.done b::after { content: " ✓"; color: var(--mint); }
.timeline li.now::before { border: 6px solid var(--accent); }
.timeline li:not(.done):not(.now) b { color: var(--ink-2); }
.text-links { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14.5px; }
.text-links a { text-decoration: none; font-weight: 500; }
.danger-link { color: var(--danger) !important; }
.plan-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
@media (max-width: 480px) { .plan-strip { grid-template-columns: 1fr; } }
.plan-chip { font: inherit; text-align: left; display: flex; flex-direction: column; gap: 2px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
.plan-chip span { font-size: 14px; color: var(--ink-2); }
.plan-chip b { font-size: 18px; }
.plan-chip:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.steps { list-style: none; display: flex; gap: 6px; margin: 4px 0 18px; padding: 0; font-size: 13.5px; color: var(--hint); flex-wrap: wrap; }
.steps li { display: flex; align-items: center; gap: 6px; }
.steps li:not(:last-child)::after { content: ""; width: 22px; height: 1px; background: var(--line); margin-left: 4px; }
.steps li span { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(30,27,75,0.16); font-size: 12px; font-weight: 600; background: #fff; }
.steps li.now { color: var(--ink); font-weight: 600; }
@media (max-width: 420px) { .steps { gap: 4px; font-size: 13px; } .steps li:not(:last-child)::after { width: 10px; } }
.steps li.now span { background: var(--accent); border-color: var(--accent); color: #fff; }
.steps li.done span { background: var(--mint-soft); border-color: transparent; color: #065f46; }
.summary { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; margin-bottom: 12px; }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 15px; }
.kv:first-child { border-top: 0; }
.kv span { color: var(--ink-2); }
.kv b { font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.checkout { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; max-width: 900px; margin: 0 auto; }
.checkout > * { min-width: 0; }
@media (max-width: 760px) { .checkout { grid-template-columns: 1fr; } .order { order: -1; } .order .ticks, .order-foot { display: none; } }
.back-link { display: block; max-width: 900px; margin: 0 auto 14px; text-decoration: none; font-weight: 500; font-size: 15px; }
.order { position: sticky; top: 18px; }
.order .kv { border: 0; padding: 4px 0 0; font-size: 17px; }
.ticks { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 8px; font-size: 14.5px; color: var(--ink-2); }
.ticks li { padding-left: 24px; position: relative; }
.ticks li::before { content: "✓"; position: absolute; left: 2px; color: var(--mint); font-weight: 700; }
.order-foot { border-top: 1px solid var(--line); padding-top: 12px; margin: 0; }
fieldset.bare { border: 0; padding: 0; margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* ---------- My account dashboard ---------- */
.wrap { max-width: 1080px; }
.dash { display: grid; grid-template-columns: 240px 1fr; gap: 22px; align-items: start; }
.dash > * { min-width: 0; }
.side { position: sticky; top: 18px; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.9); border-radius: 22px; box-shadow: 0 18px 50px rgba(30,27,75,0.08); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.who { display: flex; gap: 10px; align-items: center; padding: 4px 4px 14px; border-bottom: 1px solid var(--line); }
.who b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { display: block; font-size: 12.5px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar { width: 38px; height: 38px; flex: none; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; display: grid; place-items: center; font-weight: 600; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 15px; }
.side nav a svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.side nav a .lock { width: 14px; height: 14px; margin-left: auto; color: var(--hint); }
.side nav a:hover { background: rgba(255,255,255,0.8); color: var(--ink); }
.side nav a[aria-current="page"] { background: var(--accent); color: #fff; box-shadow: 0 8px 18px rgba(79,70,229,0.25); }
.side nav a[aria-current="page"] .lock { color: rgba(255,255,255,0.8); }
.signout { font: 500 14px var(--font); background: none; border: 0; color: var(--hint); text-align: left; padding: 8px 12px; cursor: pointer; border-top: 1px solid var(--line); padding-top: 14px; }
.signout:hover { color: var(--danger); }
.main { display: grid; gap: 18px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 6px 2px 2px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.tile { background: var(--glass); border: 1px solid rgba(255,255,255,0.9); border-radius: 18px; box-shadow: 0 12px 34px rgba(30,27,75,0.06); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; }
.tile > span:first-child { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--hint); font-weight: 600; }
.tile b { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
.tile em { font-style: normal; font-size: 13.5px; color: var(--ink-2); }
.next h2 { margin-bottom: 6px; }
.next .btn { margin-top: 14px; }
.pill.neutral { background: rgba(30,27,75,0.07); color: var(--ink-2); }
.free-line { color: var(--mint); font-size: 13.5px; font-weight: 600; margin-top: 4px; }
.free-box { background: var(--mint-soft); color: #065f46; border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; display: flex; flex-direction: column; font-size: 14px; }
.pill.bad { background: var(--danger-soft); color: var(--danger); }
.meter { height: 8px; border-radius: 99px; background: rgba(30,27,75,0.08); overflow: hidden; margin: 14px 0 8px; }
.meter i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #6366f1, #8b5cf6); }
.plan-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.plan-col { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 2px; }
.plan-col.best { border-color: rgba(79,70,229,0.45); box-shadow: 0 0 0 3px var(--accent-soft); }
.plan-col .pn { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.plan-col b { font-size: 24px; font-weight: 600; }
.plan-col .btn { margin-top: 14px; }
.plan-col .tag { position: absolute; top: -10px; right: 12px; background: var(--accent); color: #fff; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
.locked { text-align: center; padding-block: 44px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.locked svg { width: 40px; height: 40px; fill: none; stroke: var(--hint); stroke-width: 1.6; margin-bottom: 8px; }
.locked .btn { margin-top: 14px; }
.dl { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.how { list-style: none; counter-reset: how; padding: 0; margin: 20px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.how li { counter-increment: how; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.how li::before { content: counter(how); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13px; display: grid; place-items: center; margin-bottom: 6px; }
.how li span { color: var(--ink-2); }
@media (max-width: 820px) {
  .dash { grid-template-columns: 1fr; }
  .side { position: static; padding: 10px; gap: 8px; }
  .who { display: none; }
  .side nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
  .side nav a { white-space: nowrap; padding: 9px 12px; font-size: 14px; }
  .signout { display: none; }
  .tiles, .plan-grid, .how { grid-template-columns: 1fr; }
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="wrap">
  <a class="brand" href="/" aria-label="Curavo home">
    <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lg)"/><rect x="26" y="12" width="12" height="40" rx="4.5" fill="#fff"/><rect x="12" y="26" width="40" height="12" rx="4.5" fill="#fff"/><path d="M13 43 Q25 31 32 34 Q39 37 51 24" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" fill="none"/></svg>
    Curavo
  </a>
</header>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
const SITE = {
  api: 'https://cloud.curavo.in',            // the Curavo cloud
  google_client_id: '981276880805-iqp9a9mc4v2q9h8ruhpric21cest34uh.apps.googleusercontent.com',                     // "Sign in with Google" client id (Google Cloud console); '' = button hidden
  whatsapp: '+91 69014 74078',              // shown for "pay by UPI" until online payments exist
  prices: [['MONTHLY', 'Monthly', '₹589', 'about ₹20 a day'], ['HALF_YEARLY', 'Half-yearly', '₹2,899', 'about ₹16 a day'], ['YEARLY', 'Yearly', '₹4,999', 'about ₹14 a day']],
};

// ------------------------------------------------------------ small helpers
const app = document.getElementById('app');
const TOKEN_KEY = 'curavo_session';
const AFTER_KEY = 'curavo_after_signin';
const PLAN_KEY = 'curavo_chosen_plan';   // a plan picked on the home page before signing in
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
let token = load(TOKEN_KEY);

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtDate(ymd) {
  if (!ymd) return '';
  const d = new Date(ymd.length === 10 ? ymd + 'T00:00:00' : ymd);
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}
function ago(iso) {
  if (!iso) return 'not yet';
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 2) return 'just now';
  if (m < 60) return m + ' min ago';
  if (m < 48 * 60) return Math.round(m / 60) + ' hr ago';
  return fmtDate(iso);
}

async function api(path, { method = 'GET', body } = {}) {
  const headers = { Accept: 'application/json' };
  if (body) headers['Content-Type'] = 'application/json';
  if (token) headers.Authorization = 'Bearer ' + token;
  let r;
  try {
    r = await fetch(SITE.api + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    throw Object.assign(new Error('Could not reach Curavo. Check your internet and try again.'), { status: 0 });
  }
  let data = null;
  try { data = await r.json(); } catch (e) { /* empty */ }
  if (!r.ok) {
    let msg = 'Something went wrong (' + r.status + '). Please try again.';
    if (data && typeof data.detail === 'string') msg = data.detail;
    else if (r.status === 422) msg = 'Please fill in every field.';
    if (r.status === 401 && token && !path.startsWith('/account/v1/login')) { token = null; store(TOKEN_KEY, null); }
    throw Object.assign(new Error(msg), { status: r.status });
  }
  return data;
}

function signedIn(t) {
  token = t; store(TOKEN_KEY, t);
  const after = load(AFTER_KEY);
  store(AFTER_KEY, null);
  if (after) { location.href = after; return; }
  go('/account');
}

function go(path) { history.pushState({}, '', path); route(); }
window.addEventListener('popstate', route);

function note(kind, text) { return text ? `<div class="note ${kind}" role="${kind === 'err' ? 'alert' : 'status'}">${esc(text)}</div>` : ''; }

function busy(form, on) { form.querySelectorAll('button, input').forEach((el) => { el.disabled = on; }); }

// Bind a form: fn returns a promise; errors appear above the form.
function onSubmit(form, fn) {
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const out = form.querySelector('.msg');
    out.innerHTML = '';
    const data = new FormData(form);      // read BEFORE greying out: disabled fields send nothing
    busy(form, true);
    try { await fn(data); } catch (err) { out.innerHTML = note('err', err.message); }
    finally { if (document.body.contains(form)) busy(form, false); }
  });

let gsiLoading = null;
function googleButton(slot) {
  if (!SITE.google_client_id) { slot.parentElement.querySelector('.or')?.remove(); slot.remove(); return; }
  gsiLoading = gsiLoading || new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  gsiLoading.then(() => {
    google.accounts.id.initialize({
      client_id: SITE.google_client_id,
      callback: async ({ credential }) => {
        const out = slot.closest('.card').querySelector('.msg');
        try { const r = await api('/account/v1/google', { method: 'POST', body: { credential } }); signedIn(r.token); }
        catch (err) { if (out) out.innerHTML = note('err', err.message); }
      },
    });
    google.accounts.id.renderButton(slot, { theme: 'outline', size: 'large', text: 'continue_with', shape: 'pill', width: 320 });
  }).catch(() => { slot.innerHTML = '<p class="muted">Google sign-in could not load. Use email and password.</p>'; });
}

// ------------------------------------------------------------ My account (dashboard)
// Sections: Overview, Subscription, Download (only once a subscription is
// active), Shop details, Security.  The section is in the address (#subscription
// etc.) so the browser's Back button and a refresh keep the place.
const VIEWS = [
  ['overview', 'Overview', '<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>'],
  ['subscription', 'Subscription', '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>'],
  ['download', 'Download', '<path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/>'],
  ['shop', 'Shop details', '<path d="M3 9l1.5-5h15L21 9M4 9v11h16V9M3 9h18M9 20v-6h6v6"/>'],
  ['security', 'Security', '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'],
];
let ME = null;

function planOf(code) { return SITE.prices.find((p) => p[0] === code); }
function planName(code) { return (planOf(code) || [code, String(code || '').replace('_', '-').toLowerCase()])[1]; }
function todayYmd() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function fmtWhen(iso) { return iso ? new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; }
function daysUntil(ymd) { return Math.round((new Date(ymd + 'T00:00:00') - new Date(todayYmd() + 'T00:00:00')) / 86400000); }
const PLAN_MONTHS = { MONTHLY: 1, HALF_YEARLY: 6, YEARLY: 12, FOUNDING: 12 };

async function accountScreen() {
  if (!token) { (load(PLAN_KEY) ? signUpScreen : signInScreen)(); return; }
  app.innerHTML = `<div class="card"><h1>Loading…</h1></div>`;
  try { ME = await api('/account/v1/me'); } catch (err) { if (err.status === 401) { signInScreen(); return; } app.innerHTML = note('err', err.message); return; }
  const wanted = load(PLAN_KEY);          // a plan picked on the home page before signing in
  store(PLAN_KEY, null);
  if (planOf(wanted)) { checkoutPage(ME, { step: 1, plan: wanted }); return; }
  dashboard();
}

function dashboard(view) {
  const me = ME;
  view = view || (location.hash || '').slice(1);
  if (!VIEWS.some((v) => v[0] === view)) view = 'overview';
  const first = me.name ? me.name.split(' ')[0] : '';
  const st = subState(me);
  app.innerHTML = `
  <div class="dash">
    <aside class="side">
      <div class="who"><div class="avatar" aria-hidden="true">${esc((me.name || me.email)[0].toUpperCase())}</div>
        <div style="min-width:0"><b>${esc(me.name || 'Your account')}</b><span>${esc(me.email)}</span></div></div>
      <nav aria-label="My account">${VIEWS.map(([k, l, ic]) => `<a href="#${k}" data-view="${k}"${k === view ? ' aria-current="page"' : ''}>
        <svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg>${l}${k === 'download' && !st.active ? '<svg class="lock" viewBox="0 0 24 24" aria-label="locked"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>' : ''}</a>`).join('')}</nav>
      <button class="signout" id="signout">Sign out</button>
    </aside>
    <section class="main" id="view"></section>
  </div>`;
  app.querySelectorAll('[data-view]').forEach((a) => a.addEventListener('click', (e) => {
    e.preventDefault();
    history.replaceState({}, '', location.pathname + location.search + '#' + a.dataset.view);
    dashboard(a.dataset.view);
    window.scrollTo(0, 0);
  }));
  document.getElementById('signout').onclick = () => { token = null; store(TOKEN_KEY, null); history.replaceState({}, '', location.pathname + location.search); signInScreen(note('ok', 'Signed out.')); };
  const el = document.getElementById('view');
  ({ overview: viewOverview, subscription: viewSubscription, download: viewDownload, shop: viewShop, security: viewSecurity })[view](el, me, st, first);
}
function goView(v) { history.replaceState({}, '', location.pathname + location.search + '#' + v); dashboard(v); window.scrollTo(0, 0); }
function subscriptionCard(me, flow) { if (flow) return checkoutPage(me, flow); dashboard(); }   // used by the plan steps

// One place that decides what state the subscription is in.
function subState(me) {
  const s = me.subscription || {};
  const active = !!(s.paid_until && s.paid_until >= todayYmd());
  return {
    active, free: active && !!s.free_month, freeAvailable: s.free_month_available !== false,
    ended: !!(s.paid_until && !active), plan: s.plan, until: s.paid_until,
    left: active ? daysUntil(s.paid_until) : 0,
    request: s.requested_plan && planOf(s.requested_plan) ? s.requested_plan : null, requestedAt: s.requested_at,
  };
}
function statusPill(st) {
  if (st.free) return '<span class="pill info">Free month</span>';
  if (st.active && st.left <= 15) return '<span class="pill warn">Renew soon</span>';
  if (st.active) return '<span class="pill ok">Active</span>';
  if (st.request) return '<span class="pill warn">Waiting for activation</span>';
  if (st.ended) return '<span class="pill bad">Ended</span>';
  return '<span class="pill neutral">Not active</span>';
}
// The steps after "Confirm request", for the timeline.
function requestSteps(me, st) {
  const phone = esc(me.shop.phone || 'your phone');
  return st.freeAvailable && !st.active
    ? [['Plan chosen', 'We have your request and shop details.'],
       ['Our team calls you', `On ${phone}, usually within one working day.`],
       ['Account activated, first month free', 'The download appears here. Install Curavo and sign in on your shop PC.'],
       ['Pay for your plan', 'Before the free month ends, by UPI. No card or bank details are taken online.']]
    : [['Plan chosen', 'We have your request.'],
       ['Our team calls you', `On ${phone}, usually within one working day.`],
       ['Payment by UPI', 'Pay on the call. No card or bank details are taken online.'],
       ['Subscription extended', 'It reaches your shop PC by itself. Nothing to type.']];
}

// ---- Overview
function viewOverview(el, me, st, first) {
  const pcs = me.pcs || [];
  let next;
  if (st.request) {
    next = `<h2>Next: our team calls you</h2>
      <p class="muted">You chose <b>${esc(planName(st.request))}</b> (${esc(planOf(st.request)[2])}). We call ${esc(me.shop.phone || 'you')} ${st.active ? 'to complete the payment' : 'to activate your account; your first month is free'}.</p>
      <button class="btn btn-ghost" data-go-view="subscription">See the request</button>`;
  } else if (!st.active) {
    next = st.ended
      ? `<h2>Renew your subscription</h2>
         <p class="muted">Your subscription has ended. Billing keeps working; reports, backup downloads and the owner app are paused until you renew.</p>
         <button class="btn btn-primary" data-start="${esc(planOf(st.plan) ? st.plan : 'YEARLY')}">Renew now</button>`
      : `<h2>Choose a plan to get started</h2>
         <p class="muted">Every plan starts with <b>one month free</b>. Our team calls you to activate your account, then Curavo is ready to download. You pay only before the free month ends.</p>
         <button class="btn btn-primary" data-start="YEARLY">Choose a plan</button>`;
  } else if (!pcs.length) {
    next = `<h2>Next: install Curavo on your shop PC</h2>
      <p class="muted">Download it, install it, then choose <b>Sign in with your Curavo account</b> on the PC. Your subscription reaches it by itself.</p>
      <button class="btn btn-primary" data-go-view="download">Go to Download</button>`;
  } else if (st.free) {
    next = `<h2>Enjoy your free month</h2><p class="muted">It runs until ${fmtDate(st.until)}. Our team contacts you before then to complete the ${esc(planName(st.plan))} payment (${esc((planOf(st.plan) || [])[2] || '')}).</p>`;
  } else {
    next = `<h2>All set</h2><p class="muted">Your subscription reaches ${pcs.length === 1 ? 'your shop PC' : 'your ' + pcs.length + ' shop PCs'} by itself. Nothing to copy or type.</p>`;
  }
  el.innerHTML = `
    <div class="page-head"><div><h1>Welcome${first ? ', ' + esc(first) : ''}</h1><p class="sub" style="margin:0">${esc(me.shop.name || 'Your Curavo account')}${me.shop.town ? ' · ' + esc(me.shop.town) : ''}</p></div></div>
    <div class="tiles">
      <div class="tile"><span>Plan</span><b>${st.active ? esc(planName(st.plan)) : st.request ? esc(planName(st.request)) : 'None yet'}</b>${statusPill(st)}</div>
      <div class="tile"><span>${st.free ? 'Free until' : st.active ? 'Renews on' : 'Subscription'}</span><b>${st.active ? fmtDate(st.until) : st.ended ? 'Ended ' + fmtDate(st.until) : 'Not started'}</b><em>${st.active ? st.left + ' days left' : st.request ? 'Waiting for activation' : 'First month free'}</em></div>
      <div class="tile"><span>Shop PCs</span><b>${pcs.length}</b><em>${pcs.length ? 'Last online ' + ago(pcs[0].last_seen_at) : 'None linked yet'}</em></div>
    </div>
    <section class="card next">${next}</section>`;
  wireDashButtons(el, me);
}
function wireDashButtons(el, me) {
  el.querySelectorAll('[data-go-view]').forEach((b) => { b.onclick = () => goView(b.dataset.goView); });
  el.querySelectorAll('[data-start]').forEach((b) => { b.onclick = () => checkoutPage(me, { step: 1, plan: b.dataset.start }); });
}

// ---- Subscription
function viewSubscription(el, me, st) {
  const planBtn = planOf(st.plan) ? st.plan : 'YEARLY';
  let current;
  if (st.free) {
    const pct = Math.max(3, Math.min(100, Math.round(st.left / 30.4 * 100)));
    current = `<div class="status-head">${statusPill(st)}<span class="muted">${esc(planName(st.plan))} plan</span></div>
      <p class="lead">Free until <b>${fmtDate(st.until)}</b></p>
      <div class="meter" role="img" aria-label="${st.left} days left"><i style="width:${pct}%"></i></div>
      <p class="muted">${st.left} days left. After that: <b>${esc(planName(st.plan))}, ${esc((planOf(st.plan) || [])[2] || '')}</b> (GST included). Our team contacts you before ${fmtDate(st.until)} to complete the payment by UPI; the plan's time starts after the free month.</p>
      ${st.request ? '' : `<div class="btn-row"><button class="btn btn-ghost" data-start="${esc(planBtn)}">Change plan</button></div>`}`;
  } else if (st.active) {
    const months = PLAN_MONTHS[st.plan] || 12;
    const pct = Math.max(3, Math.min(100, Math.round(st.left / (months * 30.4) * 100)));
    current = `<div class="status-head">${statusPill(st)}<span class="muted">${esc(planName(st.plan))} plan</span></div>
      <p class="lead">Paid until <b>${fmtDate(st.until)}</b></p>
      <div class="meter" role="img" aria-label="${st.left} days left"><i style="width:${pct}%"></i></div>
      <p class="muted">${st.left} days left. Renewing early adds to the end date, so no days are lost.</p>
      ${st.request ? '' : `<div class="btn-row"><button class="btn btn-primary" data-start="${esc(planBtn)}">Renew</button><button class="btn btn-ghost" data-start="${esc(planBtn)}">Change plan</button></div>`}`;
  } else if (st.ended) {
    current = `<div class="status-head">${statusPill(st)}<span class="muted">${esc(planName(st.plan))} plan</span></div>
      <p class="lead">Ended on <b>${fmtDate(st.until)}</b></p>
      <p class="muted">Billing keeps working. Reports, backup downloads and the owner app are paused until you renew.</p>
      ${st.request ? '' : `<div class="btn-row"><button class="btn btn-primary" data-start="${esc(planBtn)}">Renew now</button></div>`}`;
  } else {
    current = st.request
      ? `<div class="status-head">${statusPill(st)}</div>
         <p class="lead">Your account is not active yet</p>
         <p class="muted">We have your request, see the steps below. The download unlocks as soon as our team activates your account.</p>`
      : `<div class="status-head">${statusPill(st)}</div>
         <p class="lead">Every plan starts with one month free</p>
         <p class="muted">Choose a plan below. Our team calls you to activate your account; you pay only before the free month ends.</p>`;
  }
  const steps = st.request ? requestSteps(me, st) : [];
  const pending = st.request ? `
    <section class="card">
      <div class="top-right"><h2 style="margin:0">Request received</h2><span class="muted">${esc(fmtWhen(st.requestedAt))}</span></div>
      <p class="lead"><b>${esc(planName(st.request))} plan</b> · ${esc(planOf(st.request)[2])} <span class="muted">GST included${st.freeAvailable && !st.active ? ' · first month free' : ''}</span></p>
      <ol class="timeline">${steps.map(([b, t], i) => `<li class="${i === 0 ? 'done' : i === 1 ? 'now' : ''}"><b>${b}</b><span>${t}</span></li>`).join('')}</ol>
      <div class="msg"></div>
      <div class="text-links"><a href="#" id="pchange">Change plan</a><a href="#" id="pcancel">Cancel request</a></div>
    </section>` : '';
  const freeTag = st.freeAvailable && !st.active;
  el.innerHTML = `
    <div class="page-head"><div><h1>Subscription</h1><p class="sub" style="margin:0">One plan, every feature. Prices include 18% GST.</p></div></div>
    <section class="card">${current}</section>
    ${pending}
    <section class="card">
      <h2>Plans</h2>
      <div class="plan-grid">${SITE.prices.map(([c, n, p, d]) => `<div class="plan-col${c === 'YEARLY' ? ' best' : ''}">
        ${c === 'YEARLY' ? '<span class="tag">Best value</span>' : ''}<span class="pn">${n}</span><b>${p}</b><span class="muted">${d}</span>
        ${freeTag ? '<span class="free-line">+ first month free</span>' : ''}
        ${st.request === c ? '<span class="pill info" style="margin-top:12px;align-self:flex-start">Requested</span>'
          : (st.active && st.plan === c && !st.free) ? `<button class="btn btn-ghost" data-start="${c}">Renew</button>`
          : (st.free && st.plan === c) ? '<span class="pill info" style="margin-top:12px;align-self:flex-start">Your plan</span>'
          : `<button class="btn ${c === 'YEARLY' ? 'btn-primary' : 'btn-ghost'}" data-start="${c}">Choose</button>`}
      </div>`).join('')}</div>
    </section>`;
  wireDashButtons(el, me);
  const ch = el.querySelector('#pchange');
  if (ch) {
    ch.onclick = (e) => { e.preventDefault(); checkoutPage(me, { step: 1, plan: st.request }); };
    el.querySelector('#pcancel').onclick = (e) => {
      e.preventDefault();
      const links = el.querySelector('.text-links');
      links.innerHTML = `<span class="muted">Cancel this request?</span><a href="#" id="pyes" class="danger-link">Yes, cancel</a><a href="#" id="pno">Keep it</a>`;
      links.querySelector('#pno').onclick = (ev) => { ev.preventDefault(); dashboard('subscription'); };
      links.querySelector('#pyes').onclick = async (ev) => {
        ev.preventDefault();
        try { Object.assign(me, await api('/account/v1/me/plan-request', { method: 'DELETE' })); dashboard('subscription'); }
        catch (err) { el.querySelector('.msg').innerHTML = note('err', err.message); }
      };
    };
  }
}

// ---- Download (only once the account is activated: free month or paid)
function viewDownload(el, me, st) {
  const pcs = me.pcs || [];
  if (!st.active) {
    el.innerHTML = `
      <div class="page-head"><div><h1>Download</h1></div></div>
      <section class="card locked">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <h2>Available once your account is activated</h2>
        <p class="muted">${st.request ? 'We have your request. Our team calls you to activate your account; the download then appears here.'
          : st.ended ? 'Your subscription has ended. Renew it to download Curavo again.'
          : 'Choose a plan (the first month is free). Once our team activates your account, Curavo for Windows is ready here.'}</p>
        ${st.request ? '<button class="btn btn-ghost" data-go-view="subscription">See the request</button>' : '<button class="btn btn-primary" data-go-view="subscription">Choose a plan</button>'}
      </section>`;
    wireDashButtons(el, me);
    return;
  }
  el.innerHTML = `
    <div class="page-head"><div><h1>Download</h1><p class="sub" style="margin:0">Curavo for Windows 10 and 11</p></div></div>
    <section class="card">
      <div class="dl"><div><h2 style="margin:0">Curavo for Windows</h2><p class="muted" style="margin:4px 0 0">One installer. Updates arrive by themselves after that.</p></div>
        <button class="btn btn-primary" id="dlbtn">Download</button></div>
      <div class="msg" style="margin-top:12px"></div>
      <ol class="how">
        <li><b>Install</b><span>Open the downloaded file and follow the steps.</span></li>
        <li><b>Sign in</b><span>On the PC, choose <b>Sign in with your Curavo account</b> and use ${esc(me.email)}.</span></li>
        <li><b>Done</b><span>Your subscription reaches the PC by itself.</span></li>
      </ol>
    </section>
    <section class="card">
      <h2>Shop PCs</h2>
      ${pcs.length ? pcs.map((p) => `<div class="pc"><div><b>${esc(p.shop_name || 'Shop PC')}</b><br><span class="muted">Shop code ${esc(p.shop_code)} · v${esc(p.app_version || '?')}</span></div>
        <span class="muted" style="text-align:right">Online ${ago(p.last_seen_at)}</span></div>`).join('')
        : '<p class="muted">None yet. They appear here once you sign in on the PC.</p>'}
    </section>`;
  // The installer link is made for this account on the spot and works for 15 minutes.
  const btn = el.querySelector('#dlbtn');
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = 'Preparing…';
    try {
      const r = await api('/account/v1/download');
      location.href = SITE.api + r.url;
      el.querySelector('.msg').innerHTML = note('ok', 'Your download is starting. If nothing happens, press Download again.');
    } catch (err) { el.querySelector('.msg').innerHTML = note('err', err.message); }
    finally { btn.disabled = false; btn.textContent = 'Download'; }
  };
}

// ---- Shop details
function viewShop(el, me) {
  el.innerHTML = `<div class="page-head"><div><h1>Shop details</h1><p class="sub" style="margin:0">Our team uses these to reach you. Invoices on the PC use the PC's own Pharmacy Settings.</p></div></div>
    <section class="card" id="shopcard"></section>`;
  shopCard(me);
}

// ---- Security
function viewSecurity(el, me) {
  el.innerHTML = `
    <div class="page-head"><div><h1>Security</h1></div></div>
    <section class="card">
      <h2>How you sign in</h2>
      <div class="summary">
        <div class="kv"><span>Email</span><b>${esc(me.email)}</b></div>
        <div class="kv"><span>Password</span><b>${me.has_password ? 'Set' : 'Not set'}</b></div>
        <div class="kv"><span>Google</span><b>${me.google ? 'Connected' : 'Not connected'}</b></div>
      </div>
    </section>
    <section class="card">
      <h2>${me.has_password ? 'Change password' : 'Add a password'}</h2>
      ${me.has_password ? '' : '<p class="muted">You sign in with Google. A password lets you sign in with your email too.</p>'}
      <form novalidate id="pwform" style="max-width:420px"><div class="msg"></div>
        ${me.has_password ? '<label for="cp">Current password</label><input id="cp" name="current" type="password" autocomplete="current-password">' : ''}
        <label for="np">New password <span class="muted">(at least 8 characters)</span></label><input id="np" name="new" type="password" autocomplete="new-password" minlength="8">
        <button class="btn btn-primary" type="submit" style="margin-top:16px">Save password</button>
      </form>
      <p class="muted" style="margin-top:14px">Saving a new password signs you out on every other device.</p>
    </section>
    <section class="card"><div class="dl"><div><h2 style="margin:0">Sign out</h2><p class="muted" style="margin:4px 0 0">On this browser only.</p></div>
      <button class="btn btn-ghost" id="signout2">Sign out</button></div></section>`;
  document.getElementById('signout2').onclick = () => document.getElementById('signout').click();
  const pwForm = document.getElementById('pwform');
  onSubmit(pwForm, async (f) => {
    const r = await api('/account/v1/me/password', { method: 'POST', body: { current: f.get('current') || '', new: f.get('new') } });
    token = r.token; store(TOKEN_KEY, r.token);
    Object.assign(me, r.account || {});
    pwForm.reset();
    pwForm.querySelector('.msg').innerHTML = note('ok', 'Password saved. Other devices were signed out.');
  });
}

// The plan steps get a page of their own: the steps on the left, the order
// on the right, nothing else to distract.  Leaving it reloads My account.
function checkoutPage(me, flow) {
  const [, n, price, perDay] = planOf(flow.plan) || planOf('YEARLY');
  const firstFree = (me.subscription || {}).free_month_available !== false && !subState(me).active;
  app.innerHTML = `
  <a href="/account" class="back-link" id="toacct">← My account</a>
  <div class="checkout">
    <section class="card" aria-labelledby="h-sub" id="subcard"></section>
    <aside class="card order" aria-label="Your order">
      <h2>Your order</h2>
      <div class="kv"><span>Curavo ${esc(n)}</span><b>${esc(price)}</b></div>
      <p class="muted" style="margin:2px 0 ${firstFree ? '10' : '14'}px">${esc(perDay)} · GST included</p>
      ${firstFree ? '<div class="free-box"><b>First month free</b><span>You pay only before it ends.</span></div>' : ''}
      <ul class="ticks">
        <li>Billing, stock, expiry and patients</li>
        <li>Daily cloud backup</li>
        <li>Bills even without internet</li>
        <li>Automatic updates</li>
        <li>Support on WhatsApp</li>
      </ul>
      <p class="muted order-foot">${firstFree ? 'Nothing to pay now. Our team calls you to activate your account.' : 'Nothing is charged online. Our team calls you to complete the payment by UPI.'}</p>
    </aside>
  </div>`;
  document.getElementById('toacct').onclick = (e) => { e.preventDefault(); dashboard(); window.scrollTo(0, 0); };
  checkoutSteps(document.getElementById('subcard'), me, flow);
  window.scrollTo(0, 0);
}

function checkoutSteps(card, me, flow) {
  const labels = ['Plan', 'Shop details', 'Confirm'];
  const steps = `<ol class="steps" aria-label="Steps">${labels.map((l, i) => `<li class="${i + 1 < flow.step ? 'done' : i + 1 === flow.step ? 'now' : ''}"${i + 1 === flow.step ? ' aria-current="step"' : ''}><span>${i + 1}</span>${l}</li>`).join('')}</ol>`;
  const back = (to) => `<button class="btn btn-ghost" type="button" data-back="${to}">${to ? 'Back' : 'Cancel'}</button>`;
  const wire = () => card.querySelectorAll('[data-back]').forEach((b) => {
    b.onclick = () => (b.dataset.back === '0' ? (dashboard(), window.scrollTo(0, 0)) : subscriptionCard(me, { ...flow, step: Number(b.dataset.back) }));
  });

  if (flow.step === 1) {
    card.innerHTML = `<h2 id="h-sub">Choose your plan</h2>${steps}
      <form novalidate><fieldset class="bare"><legend class="sr-only">Plan</legend>
      <div class="plans">${SITE.prices.map(([c, n, p, d]) => `<label class="plan"><input type="radio" name="plan" value="${c}"${c === flow.plan ? ' checked' : ''}>
        <span class="plan-name"><span class="radio" aria-hidden="true"></span><span>${n}<br><span class="muted">${d}</span></span></span><b>${p}</b></label>`).join('')}</div></fieldset>
      <p class="muted" style="margin-top:12px">GST included. All features in every plan${(me.subscription || {}).free_month_available !== false && !subState(me).active ? ', and the first month is free' : ''}.</p>
      <div class="btn-row">${back(0)}<button class="btn btn-primary" type="submit">Continue</button></div></form>`;
    wire();
    card.querySelectorAll('input[name=plan]').forEach((r) => r.addEventListener('change', () => {
      checkoutPage(me, { step: 1, plan: r.value });          // the order summary follows the choice
      card.ownerDocument.querySelector(`#subcard input[value="${r.value}"]`)?.focus();
    }));
    card.querySelector('form').addEventListener('submit', (e) => {
      e.preventDefault();
      subscriptionCard(me, { step: 2, plan: new FormData(e.target).get('plan') || flow.plan });
    });
    return;
  }
  if (flow.step === 2) {
    card.innerHTML = `<h2 id="h-sub">Your shop</h2>${steps}
      <p class="muted">Our team calls this number to complete the payment.</p>
      <form novalidate><div class="msg"></div>${shopFields(me)}
      <div class="btn-row">${back(1)}<button class="btn btn-primary" type="submit">Continue</button></div></form>`;
    wire();
    onSubmit(card.querySelector('form'), async (f) => {
      if (!String(f.get('shop_name') || '').trim() || !String(f.get('phone') || '').trim())
        throw new Error('Please fill in the shop name and phone number.');
      Object.assign(me, await api('/account/v1/me', { method: 'PATCH', body: shopBody(f) }));
      subscriptionCard(me, { ...flow, step: 3 });
    });
    return;
  }
  const [, n, price] = planOf(flow.plan);
  const firstFree = (me.subscription || {}).free_month_available !== false && !subState(me).active;
  const row = (k, v) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`;
  card.innerHTML = `<h2 id="h-sub">Confirm your request</h2>${steps}
    <div class="summary">
      ${row('Plan', esc(n))}
      ${row('Price', `${esc(price)} <span class="muted">GST included</span>`)}
      ${row('Shop', esc(me.shop.name) + (me.shop.town ? `, ${esc(me.shop.town)}` : ''))}
      ${row('Phone', esc(me.shop.phone))}
      ${firstFree ? row('First month', '<span style="color:var(--mint)">Free</span>') : ''}
      ${row('Payment', firstFree ? 'By UPI, before the free month ends' : 'By UPI, when our team calls you')}
    </div>
    <p class="muted">${firstFree ? 'Nothing to pay now. Our team calls you to activate your account; the download then appears in your account.' : 'Our team calls you to complete the payment.'}</p>
    <form novalidate><div class="msg"></div>
      <div class="btn-row">${back(2)}<button class="btn btn-primary" type="submit">Confirm request</button></div></form>`;
  wire();
  onSubmit(card.querySelector('form'), async () => {
    Object.assign(me, await api('/account/v1/me/plan-request', { method: 'POST', body: { plan: flow.plan } }));
    goView('subscription');            // now showing "Request received"
  });
}

// ------------------------------------------------------------ shop details
function shopFields(me) {
  return `<label for="sn">Shop name</label><input id="sn" name="shop_name" value="${esc(me.shop.name)}" autocomplete="organization" required>
    <div class="two">
      <div><label for="ph">Phone</label><input id="ph" name="phone" value="${esc(me.shop.phone)}" inputmode="tel" autocomplete="tel" required></div>
      <div><label for="tw">Town</label><input id="tw" name="town" value="${esc(me.shop.town)}"></div>
    </div>
    <label for="gs">GSTIN <span class="muted">(optional)</span></label><input id="gs" name="gstin" value="${esc(me.shop.gstin)}" maxlength="15" style="text-transform:uppercase">
    <label for="yn">Your name</label><input id="yn" name="name" value="${esc(me.name)}" autocomplete="name">`;
}
function shopBody(f) { return { shop_name: f.get('shop_name'), phone: f.get('phone'), town: f.get('town'), gstin: f.get('gstin'), name: f.get('name') }; }

function shopCard(me, editing = false) {
  const card = document.getElementById('shopcard');
  const s = me.shop;
  if (!editing) {
    const has = s.name || s.phone;
    card.innerHTML = `<div class="top-right"><h2 id="h-shop" style="margin:0">Your shop</h2><button class="btn btn-ghost btn-sm" id="sedit">${has ? 'Edit' : 'Add'}</button></div>
      ${has ? `<div class="summary" style="margin-top:14px">
        <div class="kv"><span>Shop</span><b>${esc(s.name || '-')}</b></div>
        <div class="kv"><span>Phone</span><b>${esc(s.phone || '-')}</b></div>
        <div class="kv"><span>Town</span><b>${esc(s.town || '-')}</b></div>
        <div class="kv"><span>GSTIN</span><b>${esc(s.gstin || '-')}</b></div>
        <div class="kv"><span>Owner</span><b>${esc(me.name || '-')}</b></div></div>`
      : `<p class="muted" style="margin-top:10px">Not added yet. You can also add them when you choose a plan.</p>`}`;
    card.querySelector('#sedit').onclick = () => shopCard(me, true);
    return;
  }
  card.innerHTML = `<h2 id="h-shop">Edit shop details</h2>
    <form novalidate><div class="msg"></div>${shopFields(me)}
    <div class="btn-row"><button class="btn btn-ghost" type="button" id="scancel">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div></form>`;
  card.querySelector('#scancel').onclick = () => shopCard(me);
  onSubmit(card.querySelector('form'), async (f) => {
    Object.assign(me, await api('/account/v1/me', { method: 'PATCH', body: shopBody(f) }));
    shopCard(me);
  });
}

// ------------------------------------------------------------ routing
function wireLinks() {
  app.querySelectorAll('[data-go]').forEach((a) => a.addEventListener('click', (e) => {
    e.preventDefault();
    ({ signin: () => signInScreen(), signup: signUpScreen, forgot: forgotScreen })[a.dataset.go]();
    window.scrollTo(0, 0);
  }));
}

function route() {
  const params = new URLSearchParams(location.search);
  // Opened as a plain file (preview), the page name comes from ?page=
  let path = location.pathname.replace(/\/+$/, '');
  if (path.endsWith('.html')) path = '/' + (params.get('page') || 'account');
  // /account?plan=YEARLY from the home page's price cards: remember the plan
  // (it survives signing up and the confirm-your-email link), then tidy the URL.
  if (params.get('plan')) {
    store(PLAN_KEY, params.get('plan').toUpperCase());
    params.delete('plan');
    history.replaceState({}, '', location.pathname + (params.toString() ? '?' + params : ''));
  }
  if (path === '/link') return linkScreen(params.get('code'));
  if (path === '/account/verify') return verifyScreen(params.get('token'));
  if (path === '/account/reset') return resetScreen(params.get('token'));
  if (location.hash === '#signup' && !token) return signUpScreen();
  return accountScreen();
}
route();
</script>
